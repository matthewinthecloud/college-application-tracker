<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>College Application Tracker</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #fff;
        --text: #18202b;
        --muted: #687386;
        --line: #dfe3e8;
        --accent: #2457d6;
        --nav: #111827;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.4 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      body.dark {
        --bg: #0f131a;
        --panel: #171d27;
        --text: #edf1f7;
        --muted: #a5afbe;
        --line: #303846;
        --nav: #090c12;
        --accent: #7aa2ff;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 7px;
        padding: 7px 10px;
        cursor: pointer;
      }
      .primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .danger {
        color: #b91c1c;
      }
      .app {
        display: grid;
        grid-template-columns: 210px 1fr;
        min-height: 100vh;
      }
      aside {
        background: var(--nav);
        color: #dbe2ee;
        padding: 18px 12px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        font-size: 17px;
        font-weight: 750;
        padding: 3px 10px 18px;
      }
      .nav button {
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        color: #aeb8c8;
        padding: 9px 11px;
        margin: 2px 0;
      }
      .nav button.active,
      .nav button:hover {
        background: #243044;
        color: #fff;
      }
      .shell {
        min-width: 0;
      }
      header {
        height: 58px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 18px;
        position: sticky;
        top: 0;
        z-index: 8;
      }
      .search {
        flex: 1;
        max-width: 520px;
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 8px;
        padding: 8px 11px;
      }
      main {
        padding: 18px;
        max-width: 1600px;
      }
      .titlebar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 23px;
        margin: 0;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 10px;
      }
      h3 {
        font-size: 14px;
        margin: 15px 0 7px;
      }
      .muted {
        color: var(--muted);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(7, minmax(120px, 1fr));
        gap: 9px;
      }
      .metric,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 13px;
      }
      .metric b {
        display: block;
        font-size: 24px;
        margin-top: 6px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 10px;
      }
      .toolbar input,
      .toolbar select,
      .field input,
      .field select,
      .field textarea {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px;
        width: 100%;
      }
      .toolbar input,
      .toolbar select {
        width: auto;
      }
      .tablewrap {
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 1100px;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 7px 9px;
        text-align: left;
        height: 44px;
        white-space: nowrap;
      }
      th {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--muted);
        position: sticky;
        top: 0;
        background: var(--panel);
        z-index: 2;
      }
      tr.school {
        border-left: 4px solid var(--status);
      }
      tr.school td {
        background: color-mix(in srgb, var(--status) 10%, var(--panel));
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid currentColor;
        border-radius: 99px;
        padding: 3px 7px;
        font-size: 12px;
        font-weight: 650;
      }
      .pillselect {
        border: 0;
        background: transparent;
        font-weight: 650;
        max-width: 150px;
      }
      .urg {
        font-size: 11px;
        font-weight: 750;
        padding: 3px 6px;
        border-radius: 99px;
        background: #e5e7eb;
        color: #374151;
      }
      .urg.amber {
        background: #fef3c7;
        color: #92400e;
      }
      .urg.orange {
        background: #ffedd5;
        color: #9a3412;
      }
      .urg.red {
        background: #fee2e2;
        color: #b91c1c;
      }
      .urg.over {
        background: #7f1d1d;
        color: #fff;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #dc2626;
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      .kanban {
        display: grid;
        grid-template-columns: repeat(7, minmax(230px, 1fr));
        gap: 10px;
        overflow: auto;
        padding-bottom: 8px;
      }
      .column {
        background: color-mix(in srgb, var(--c) 8%, var(--panel));
        border-top: 4px solid var(--c);
        border-radius: 8px;
        padding: 8px;
        min-height: 340px;
      }
      .column h2 {
        font-size: 13px;
      }
      .kcard {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        margin: 7px 0;
        cursor: grab;
      }
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .day {
        min-height: 110px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 6px;
      }
      .day.off {
        opacity: 0.45;
      }
      .event {
        font-size: 11px;
        padding: 3px 5px;
        margin: 3px 0;
        border-radius: 4px;
        background: #dbeafe;
        color: #1e40af;
        overflow: hidden;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 14px;
        overflow: auto;
      }
      .tabs button {
        border: 0;
        border-radius: 0;
        background: transparent;
      }
      .tabs button.active {
        color: var(--accent);
        border-bottom: 2px solid var(--accent);
      }
      .formgrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .field label {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--muted);
        display: block;
        margin-bottom: 4px;
      }
      .wide {
        grid-column: 1/-1;
      }
      .repeat {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        margin: 8px 0;
      }
      .drawer {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: min(760px, 100%);
        background: var(--panel);
        box-shadow: -10px 0 35px #0003;
        z-index: 20;
        padding: 18px;
        overflow: auto;
      }
      .drawerhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: -18px;
        background: var(--panel);
        padding: 12px 0;
        z-index: 2;
      }
      .empty {
        text-align: center;
        padding: 35px;
        color: var(--muted);
      }
      .flag {
        color: #7c3aed;
        font-size: 11px;
      }
      .mobileNav {
        display: none;
      }
      .toast {
        position: fixed;
        bottom: 18px;
        right: 18px;
        background: #111827;
        color: #fff;
        padding: 9px 13px;
        border-radius: 7px;
        z-index: 40;
      }
      .check {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .overline {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      :root {
        --bg: #f3f5fb;
        --panel: #ffffffdf;
        --text: #11182a;
        --muted: #667085;
        --line: #dfe4ef;
        --accent: #6157e8;
        --accent2: #06b6d4;
        --nav: #11142d;
      }
      body {
        background:
          radial-gradient(circle at 85% -5%, #b7e8ff 0, transparent 28%),
          radial-gradient(circle at 20% 0, #ddd8ff 0, transparent 30%),
          var(--bg);
      }
      .brand {
        font-size: 19px;
        font-weight: 850;
        background: linear-gradient(90deg, #a5b4fc, #67e8f9);
        -webkit-background-clip: text;
        color: transparent;
      }
      .brand:after {
        content: " ✦";
        color: #67e8f9;
      }
      .metric,
      .panel {
        border-color: #fff9;
        border-radius: 14px;
        box-shadow: 0 12px 35px #2430580c;
        backdrop-filter: blur(14px);
      }
      .kcard {
        border-color: #fff9;
        border-radius: 12px;
        box-shadow: 0 8px 22px #11182712;
        transition: 0.18s;
      }
      .kcard:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px #11182720;
      }
      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border: 0;
      }
      .tablewrap {
        border-radius: 14px;
        box-shadow: 0 14px 40px #25305a0d;
      }
      .pathway-card {
        background: linear-gradient(135deg, #6257e8, #129bc3);
        color: white;
        border-radius: 14px;
        padding: 15px;
        box-shadow: 0 14px 30px #5253cb33;
      }
      .pathway-card select {
        background: #ffffff22;
        color: white;
        border: 1px solid #ffffff66;
      }
      .pathway-card option {
        color: #111;
      }
      .decision-window {
        font-weight: 800;
        font-size: 16px;
      }
      .supp-badge {
        display: inline-flex;
        background: #eceafe;
        color: #4f46e5;
        border-radius: 99px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 800;
      }
      aside {
        background: linear-gradient(
          180deg,
          #10132e 0%,
          #17123b 55%,
          #102f46 100%
        );
        box-shadow: 12px 0 40px #312e8130;
      }
      header {
        background: #ffffffb8;
        backdrop-filter: blur(18px);
        box-shadow: 0 8px 30px #28315d0b;
      }
      .nav button {
        border-radius: 10px;
        transition: 0.18s;
      }
      .nav button.active {
        background: linear-gradient(90deg, #6558e8aa, #14b8a699);
        box-shadow: 0 8px 20px #11182725;
      }
      .portal-card {
        margin-top: 12px;
        padding: 16px;
        border-radius: 15px;
        background: linear-gradient(
          135deg,
          #111936 0%,
          #2e2b75 55%,
          #087f8c 100%
        );
        color: #fff;
        box-shadow: 0 16px 38px #24206335;
        position: relative;
        overflow: hidden;
      }
      .portal-card:after {
        content: "↗";
        position: absolute;
        right: 18px;
        top: 7px;
        font-size: 56px;
        font-weight: 900;
        color: #ffffff12;
        transform: rotate(-8deg);
      }
      .portal-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        margin-top: 10px;
      }
      .portal-row input {
        min-width: 0;
        border: 1px solid #ffffff38;
        background: #ffffff16;
        color: #fff;
        border-radius: 9px;
        padding: 10px;
      }
      .portal-row input::placeholder {
        color: #dbeafeaa;
      }
      .portal-row button,
      .portal-row a {
        display: flex;
        align-items: center;
        text-decoration: none;
        border: 1px solid #ffffff50;
        background: #ffffff1f;
        color: #fff;
        border-radius: 9px;
        padding: 9px 12px;
        font-weight: 750;
      }
      .portal-status {
        display: inline-flex;
        gap: 7px;
        align-items: center;
        margin-top: 10px;
        background: #ffffff12;
        border-radius: 99px;
        padding: 5px 9px;
      }
      .portal-status input {
        accent-color: #2dd4bf;
      }
      .metric {
        transition:
          0.2s transform,
          0.2s box-shadow;
      }
      .metric:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 40px #4f46e51a;
      }
      .titlebar h1 {
        background: linear-gradient(90deg, #29246f, #1687a4);
        -webkit-background-clip: text;
        color: transparent;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      @media (max-width: 600px) {
        .portal-row {
          grid-template-columns: 1fr;
        }
        .portal-row button,
        .portal-row a {
          justify-content: center;
        }
      }
      @media (max-width: 900px) {
        .app {
          display: block;
        }
        aside {
          display: none;
        }
        .mobileNav {
          display: block;
        }
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid2,
        .grid3,
        .formgrid {
          grid-template-columns: 1fr;
        }
        .kanban {
          display: block;
        }
        .column {
          display: none;
        }
        .column.mobile-active {
          display: block;
        }
        .toolbar input,
        .toolbar select {
          width: 100%;
        }
        main {
          padding: 12px;
        }
        header {
          padding: 0 10px;
        }
        .hide-sm {
          display: none;
        }
      }
    </style>
  </head>

      function portalCard(s) {
        let href = portalHref(s.portalUrl);
        return `<div class="portal-card"><div class="overline" style="color:#a5f3fc">Applicant portal</div><h2 style="margin:4px 0;color:white">Your direct login link</h2><div class="portal-row"><input type="url" value="${esc(s.portalUrl)}" placeholder="Paste the applicant portal link when it arrives" onchange="upd('${s.id}','portalUrl',this.value)">${href ? `<a href="${esc(href)}" target="_blank" rel="noopener">Open portal ↗</a>` : `<button onclick="toast('Paste your portal link first')">Open portal ↗</button>`}<button onclick="copyPortal('${s.id}')">Copy</button></div><label class="portal-status"><input type="checkbox" ${s.portalLogin ? "checked" : ""} onchange="upd('${s.id}','portalLogin',this.checked)"> Login created</label></div>`;
      }
      function detailTab(s) {
        if (tab === "Overview")
          return `<div class="pathway-card"><div class="overline" style="color:#dbeafe">Application pathway</div><div class="grid3"><div><select onchange="setPathway('${s.id}',this.value)">${pathOptions(s)}</select></div><div><b>Deadline</b><br>${s.deadline}</div><div><b>Decision release</b><br><span class="decision-window">${esc(s.decisionWindow)}</span></div></div></div>${portalCard(s)}<div class="panel" style="margin-top:12px"><p><span class="supp-badge">${s.suppCount} required supplement${s.suppCount === 1 ? "" : "s"}</span></p><p class="muted">${esc(s.suppNote)}</p><div class="formgrid">${field(s, "name", "School name")}${field(s, "city", "City")}${field(s, "state", "State")}${field(s, "region", "Region")}${field(s, "distance", "Distance from home")}${field(s, "scholarshipDeadline", "Scholarship deadline", "date")}${field(s, "honorsDeadline", "Honors deadline", "date")}${field(s, "portfolioDeadline", "Portfolio deadline", "date")}${field(s, "interviewDeadline", "Interview request deadline", "date")}${field(s, "platform", "Application platform", "select", ["Common App", "Coalition", "Institutional portal", "UC application", "Other"])}${field(s, "fee", "Application fee", "number")}${field(s, "feeWaiver", "Fee waiver used", "checkbox")}${field(s, "concerns", "Concerns / red flags", "textarea")}<div class="field wide"><label>Status</label>${statusControl(s.status, s.id)}</div></div><p class="muted">${esc(s.dataNote)}</p><button class="danger" onclick="deleteSchool('${s.id}')">Delete school</button></div>`;
        if (tab === "Essays")
          return `<div class="panel"><p><span class="supp-badge">${s.suppCount} required for Arts & Sciences</span></p><p class="muted">${esc(s.suppNote)}</p><h2>Main personal essay</h2><div class="formgrid">${nestedField(s, "mainEssay.status", "Status", "select", ["not started", "drafting", "with reviewer", "revised", "final"])}${nestedField(s, "mainEssay.drafts", "Draft count", "number")}${nestedField(s, "mainEssay.lastEdited", "Last edited", "date")}${nestedField(s, "mainEssay.reviewer", "Reviewer")}${nestedField(s, "mainEssay.revisionNotes", "Revision notes", "textarea")}</div><h2>Supplemental essays</h2>${s.essays.map((e, i) => essayForm(s, e, i)).join("")}<button onclick="addEssay('${s.id}')">+ Add supplement</button></div>`;
        if (tab === "Interviews")
          return `<div class="panel"><div class="formgrid">${nestedField(s, "interview.policy", "Policy", "select", ["evaluative", "informational", "offered", "not offered"])}${nestedField(s, "interview.requested", "Requested", "checkbox")}${nestedField(s, "interview.date", "Scheduled date", "datetime-local")}${nestedField(s, "interview.name", "Interviewer name")}${nestedField(s, "interview.thanks", "Thank-you sent", "checkbox")}${field(s, "portfolioRequired", "Portfolio / audition required", "checkbox")}${field(s, "portfolioSubmitted", "Portfolio submitted", "date")}${field(s, "honorsRequired", "Honors college required", "checkbox")}${field(s, "honorsSubmitted", "Honors application submitted", "checkbox")}${field(s, "scholarshipCount", "Separate scholarship count", "number")}${field(s, "scholarshipsSubmitted", "Scholarships submitted", "checkbox")}</div></div>`;
        if (tab === "Documents") return docsTab(s);
        if (tab === "Interest log") return interestTab(s);
        return `<div class="panel"><div class="formgrid">${field(s, "notes", "General notes", "textarea")}${nestedField(s, "rep.name", "Admissions rep name")}${nestedField(s, "rep.email", "Admissions rep email", "email")}${nestedField(s, "rep.territory", "Territory")}</div></div>`;
      }
      function nestedField(s, path, label, type = "text", opts = []) {
        let [a, b] = path.split("."),
          v = s[a][b];
        if (type === "checkbox")
          return `<div class="field"><label>${label}</label><input type="checkbox" ${v ? "checked" : ""} onchange="updNested('${s.id}','${a}','${b}',this.checked)"></div>`;
        if (type === "textarea")
          return `<div class="field wide"><label>${label}</label><textarea onchange="updNested('${s.id}','${a}','${b}',this.value)">${esc(v)}</textarea></div>`;
        if (type === "select")
          return `<div class="field"><label>${label}</label><select onchange="updNested('${s.id}','${a}','${b}',this.value)">${opts.map((x) => `<option ${v === x ? "selected" : ""}>${x}</option>`)}</select></div>`;
        return `<div class="field"><label>${label}</label><input type="${type}" value="${esc(v)}" onchange="updNested('${s.id}','${a}','${b}',this.value)"></div>`;
      }
      function essayForm(s, e, i) {
        return `<div class="repeat"><div class="formgrid"><div class="field"><label>Title</label><input value="${esc(e.title)}" onchange="updList('${s.id}','essays',${i},'title',this.value)"></div><div class="field"><label>Word limit</label><input type="number" value="${e.wordLimit || ""}" onchange="updList('${s.id}','essays',${i},'wordLimit',this.value)"></div><div class="field"><label>Status</label><select onchange="updList('${s.id}','essays',${i},'status',this.value)">${["not started", "drafting", "with reviewer", "revised", "final"].map((x) => `<option ${e.status === x ? "selected" : ""}>${x}</option>`)}</select></div><div class="field"><label>Draft count</label><input type="number" value="${e.drafts || 0}" onchange="updList('${s.id}','essays',${i},'drafts',this.value)"></div><div class="field wide"><label>Prompt text</label><textarea oninput="wordCount(this,${e.wordLimit || 0})" onchange="updList('${s.id}','essays',${i},'prompt',this.value)">${esc(e.prompt)}</textarea><span class="muted">Prompt words: <b>0</b></span></div><div class="field"><label>Reviewer</label><input value="${esc(e.reviewer || "")}" onchange="updList('${s.id}','essays',${i},'reviewer',this.value)"></div><div class="field wide"><label>Revision notes</label><textarea onchange="updList('${s.id}','essays',${i},'revisionNotes',this.value)">${esc(e.revisionNotes || "")}</textarea></div></div><button class="danger" onclick="removeList('${s.id}','essays',${i})">Remove</button></div>`;
      }
      function docsTab(s) {
        let docs = requiredDocs(s);
        return `<div class="panel"><div class="formgrid">${field(s, "testsRequired", "Standardized tests required")}${field(s, "scoresSent", "Scores sent", "checkbox")}${field(s, "scoresDate", "Scores sent date", "date")}${field(s, "transcriptRequested", "Transcript requested", "checkbox")}${field(s, "transcriptSent", "Transcript sent date", "date")}${field(s, "counselorForm", "Counselor form", "select", ["Not started", "Requested", "Submitted"])}${field(s, "midyearRequired", "Mid-year required", "checkbox")}${field(s, "midyearSent", "Mid-year sent date", "date")}${field(s, "confirmation", "Submission confirmation #")}${field(s, "portalComplete", "Portal shows complete", "checkbox")}${field(s, "portalCompleteDate", "Portal complete date", "date")}${field(s, "decisionDate", "Decision date", "date")}${field(s, "outcome", "Outcome", "select", ["", "admit", "waitlist", "deny", "deferred"])}${field(s, "waitlistAccepted", "Waitlist spot accepted", "checkbox")}${field(s, "lociSent", "LOCI sent", "checkbox")}${field(s, "lociDate", "LOCI date", "date")}${field(s, "depositDeadline", "Deposit deadline", "date")}${field(s, "depositPaid", "Deposit paid", "checkbox")}${field(s, "housingDeadline", "Housing deadline", "date")}${field(s, "housingSubmitted", "Housing submitted", "checkbox")}${field(s, "orientation", "Orientation registered", "checkbox")}${field(s, "finalTranscriptRequested", "Final transcript requested", "checkbox")}${field(s, "finalTranscriptSent", "Final transcript sent", "date")}</div><h2>Submission checklist</h2>${docs.map((d, i) => `<label class="repeat check"><input type="checkbox" ${d.checked ? "checked" : ""} onchange="checkDoc('${s.id}',${i},this.checked)">${esc(d.name)} ${d.date ? `<span class="muted">${d.date}</span>` : ""}</label>`).join("") || '<div class="empty">Generated when status becomes Ready to submit.</div>'}</div>`;
      }
      function interestTab(s) {
        return `<div class="panel"><p><span class="flag">Interest rating: ${s.interestRating}</span></p>${s.interestLog.map((x, i) => `<div class="repeat"><b>${esc(x.type)}</b> · ${x.date}<button style="float:right" class="danger" onclick="removeList('${s.id}','interestLog',${i})">Remove</button></div>`).join("")}<button onclick="addInterest('${s.id}')">+ Log interest action</button></div>`;
      }
      function render() {
        let content =
          view === "Dashboard"
            ? dashboard()
            : view === "Pipeline"
              ? pipeline()
              : view === "Table"
                ? tableView()
                : view === "Calendar"
                  ? calendar()
                  : view === "Essay board"
                    ? essayBoard()
                    : deadlinesView();
        shell(content);
      }
      function go(v) {
        view = v;
        render();
      }
      function openSchool(id, t) {
        selected = id;
        if (t) tab = t;
        render();
      }
      function upd(id, k, v) {
        let s = data.find((x) => x.id === id);
        s[k] = v;
        save();
        render();
      }
      function updNested(id, a, b, v) {
        data.find((x) => x.id === id)[a][b] = v;
        save();
        render();
      }
      function updList(id, l, i, k, v) {
        data.find((x) => x.id === id)[l][i][k] = v;
        save();
        render();
      }
      function removeList(id, l, i) {
        if (confirm("Remove this item?")) {
          data.find((x) => x.id === id)[l].splice(i, 1);
          save();
          render();
        }
      }
      function setStatus(id, v) {
        let s = data.find((x) => x.id === id);
        if (v === "Ready to submit" && !s.documents.length)
          s.documents = requiredDocs(s);
        if (v === "Submitted") {
          let missing = requiredDocs(s).filter((x) => !x.checked);
          if (
            missing.length &&
            !confirm(
              `${missing.length} required items are unchecked. Override and mark submitted?`,
            )
          ) {
            render();
            return;
          }
          s.submittedAt = iso();
          if (!s.documents.length) s.documents = requiredDocs(s);
        }
        if (v === "Decision received") {
          let out = prompt(
            "Outcome: admit, waitlist, deny, or deferred",
            s.outcome || "",
          );
          if (!out) {
            render();
            return;
          }
          s.outcome = out;
          s.decisionDate =
            prompt(
              "Decision date (YYYY-MM-DD)",
              new Date().toISOString().slice(0, 10),
            ) || "";
        }
        s.status = v;
        save();
        render();
      }
      function checkDoc(id, i, v) {
        let s = data.find((x) => x.id === id);
        if (!s.documents.length) s.documents = requiredDocs(s);
        s.documents[i].checked = v;
        s.documents[i].date = v ? new Date().toISOString().slice(0, 10) : "";
        save();
        render();
      }
      function addEssay(id) {
        data
          .find((x) => x.id === id)
          .essays.push({
            title: "New supplement",
            prompt: "",
            wordLimit: 0,
            status: "not started",
            drafts: 0,
            reviewer: "",
            revisionNotes: "",
          });
        save();
        render();
      }
      function addInterest(id) {
        let type = prompt("Action type (visit, webinar, email, fair, etc.)");
        if (type) {
          data
            .find((x) => x.id === id)
            .interestLog.push({
              type,
              date: new Date().toISOString().slice(0, 10),
            });
          save();
          render();
        }
      }
      function newSchool() {
        let name = prompt("School name");
        if (!name) return;
        let s = seed()[0];
        s.id = uid();
        s.name = name;
        s.city = "";
        s.state = "";
        s.region = "";
        s.interestRating = "Not considered";
        data.unshift(s);
        save();
        selected = s.id;
        render();
      }
      function deleteSchool(id) {
        if (confirm("Delete this school and all of its data?")) {
          data = data.filter((x) => x.id !== id);
          selected = null;
          save();
          render();
        }
      }
      function resetSeed() {
        if (
          confirm(
            "Reset everything to the original 27 schools? This replaces current data.",
          )
        ) {
          data = seed();
          save();
          render();
        }
      }
      function toggleDark() {
        document.body.classList.toggle("dark");
        save();
      }
      function wordCount(el, limit) {
        let n = el.value.trim() ? el.value.trim().split(/\s+/).length : 0,
          b = el.nextElementSibling.querySelector("b");
        b.textContent = n;
        b.style.color = limit && n > limit ? "#dc2626" : "";
      }
      function notifyPermission() {
        if ("Notification" in window)
          Notification.requestPermission().then((x) =>
            toast("Notification permission: " + x),
          );
        else toast("Browser notifications unavailable");
      }
      function toast(t) {
        let x = document.createElement("div");
        x.className = "toast";
        x.textContent = t;
        document.body.appendChild(x);
        setTimeout(() => x.remove(), 2200);
      }
      function dl(name, text, type) {
        let a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([text], { type }));
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
      }
      function exportJSON() {
        dl(
          "college-tracker.json",
          JSON.stringify(data, null, 2),
          "application/json",
        );
      }
      function importJSON(f) {
        if (!f) return;
        let r = new FileReader();
        r.onload = () => {
          try {
            let x = JSON.parse(r.result);
            if (!Array.isArray(x)) throw 0;
            if (confirm("Replace current data with this JSON?")) {
              data = x;
              save();
              render();
            }
          } catch {
            alert("Invalid tracker JSON");
          }
        };
        r.readAsText(f);
      }
      function exportCSV() {
        let h = [
          "name",
          "city",
          "state",
          "region",
          "distance",
          "round",
          "deadline",
          "scholarshipDeadline",
          "honorsDeadline",
          "portfolioDeadline",
          "interviewDeadline",
          "platform",
          "portalUrl",
          "portalLogin",
          "fee",
          "feeWaiver",
          "status",
          "decisionWindow",
          "suppCount",
          "suppNote",
          "concerns",
          "notes",
        ];
        let q = (v) => '"' + String(v ?? "").replaceAll('"', '""') + '"';
        dl(
          "college-tracker.csv",
          [
            h.join(","),
            ...data.map((s) => h.map((k) => q(s[k])).join(",")),
          ].join("\n"),
          "text/csv",
        );
      }
      function importCSV(f) {
        if (!f) return;
        let r = new FileReader();
        r.onload = () => {
          let lines = r.result.split(/\r?\n/).filter(Boolean),
            parse = (l) => {
              let a = [],
                x = "",
                q = false;
              for (let i = 0; i < l.length; i++) {
                let c = l[i];
                if (c === '"' && l[i + 1] === '"') {
                  x += '"';
                  i++;
                } else if (c === '"') q = !q;
                else if (c === "," && !q) {
                  a.push(x);
                  x = "";
                } else x += c;
              }
              a.push(x);
              return a;
            },
            h = parse(lines.shift());
          for (let line of lines) {
            let o = Object.fromEntries(parse(line).map((v, i) => [h[i], v])),
              s = seed()[0];
            Object.assign(s, o, { id: uid() });
            data.push(s);
          }
          save();
          render();
        };
        r.readAsText(f);
      }
      function mobileMenu() {
        let x = document.querySelector("aside");
        x.style.display = x.style.display === "block" ? "none" : "block";
        x.style.position = "fixed";
        x.style.zIndex = 30;
        x.style.width = "230px";
      }
      document.addEventListener("keydown", (e) => {
        if (
          e.key === "/" &&
          !/input|textarea/i.test(document.activeElement.tagName)
        ) {
          e.preventDefault();
          document.getElementById("search").focus();
        }
        if (
          e.key === "n" &&
          !/input|textarea/i.test(document.activeElement.tagName)
        )
          newSchool();
        if (e.key === "Escape" && selected) {
          selected = null;
          render();
        }
      });
      render();
    </script>
  </body>
</html>
